name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-docker:
    name: Preprocess, train, test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build cleaned dataset
        run: python data/preprocess.py

      - name: Validate processed dataset
        run: python -c "import pandas as pd; from schema import FEATURES, TARGET; df = pd.read_csv('data/accidents.csv'); assert df.shape == (12316, 16), df.shape; assert list(df.columns) == FEATURES + [TARGET]; assert set(df[TARGET].unique()) == {0, 1}; print(df.shape, round(float(df[TARGET].mean()), 4))"

      - name: Reset MLflow tracking for CI
        run: |
          rm -f mlflow.db
          rm -rf mlruns mlartifacts

      - name: Train real-data model
        run: python train.py --all --promote always

      - name: Run tests
        run: python -m pytest -v --tb=short

      - name: Build serving image
        run: docker build -t road-accident-prediction .

      - name: Start container and check health
        run: |
          docker run -d --name road-accident-prediction -p 8000:8000 road-accident-prediction
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "Health check failed"
          docker logs road-accident-prediction
          exit 1

      - name: Stop container
        if: always()
        run: |
          docker stop road-accident-prediction || true
          docker rm road-accident-prediction || true
